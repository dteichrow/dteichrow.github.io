name: Validate the publication artifact
on:
  workflow_call:
    inputs:
      upload-pages:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Install Python and browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Check source repository
        run: python scripts/repo_doctor.py --json
      - name: Build the artifact once
        run: python -m src.build_site --site-base-url /
      - name: Validate evidence and public surfaces
        run: |
          python scripts/validate_tool_sources.py
          python scripts/smoke_test_tool_pages.py
          python -m pytest
      - name: Exercise interactions, accessibility and mobile layouts
        run: pnpm test:browser
      - name: Measure mobile performance
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory docs > /tmp/edge-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          pnpm test:performance
      - name: Record and validate the tested artifact
        run: python scripts/validate_artifact.py --write-manifest
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-verification
          path: |
            output/playwright/
            output/lighthouse/
            output/validation/
          retention-days: 30
      - name: Upload the exact tested Pages artifact
        if: inputs.upload-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
