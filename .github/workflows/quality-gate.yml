name: quality_gate
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'OPERATIONS.md'
      - 'README.md'
      - 'assets/**'
      - 'content/**'
      - 'data/**'
      - 'external/**'
      - 'requirements.txt'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'playwright.config.js'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
permissions:
  contents: read
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: ./.github/workflows/validate-artifact.yml
