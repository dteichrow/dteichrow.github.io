name: deploy_pages

on:
  schedule:
    # Content producers commit throughout the hour. Publish the latest settled
    # state twice hourly instead of queueing a separate Pages deployment per
    # Newsdesk or Substack update.
    - cron: "23,53 * * * *"
  push:
    branches:
      - main
    paths:
      # Code and workflow edits still deploy immediately. Content updates use
      # the scheduled delivery path above, which prevents duplicate requests
      # while Pages is draining a prior deployment.
      - ".github/workflows/deploy-pages.yml"
      - "src/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build umbrella site
        run: python -m src.build_site --site-base-url /

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The site artifact is built before this job starts. GitHub Pages can
    # occasionally hold a valid artifact in its provider queue for well beyond
    # the usual few minutes, so retain one serialized deployment long enough
    # for that work to complete. A genuinely stuck provider still fails within
    # a bounded window and is retried by the next scheduled delivery.
    timeout-minutes: 35
    environment:
      name: github-pages
      url: https://dteichrow.github.io/
    steps:
      - name: Check out deployment client
        uses: actions/checkout@v7

      - name: Let Pages settle before deployment
        run: sleep 45

      - name: Create and observe Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/deploy_pages.py --max-wait-seconds 1800 --poll-seconds 10
