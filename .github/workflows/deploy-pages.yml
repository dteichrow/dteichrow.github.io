name: deploy_pages

on:
  schedule:
    # Content producers commit throughout the hour. Publish the latest settled
    # state twice hourly instead of queueing a separate Pages deployment per
    # Newsdesk or Substack update.
    - cron: "23,53 * * * *"
  push:
    branches:
      - main
    paths:
      # Code and workflow edits still deploy immediately. Content updates use
      # the scheduled delivery path above, which prevents duplicate requests
      # while Pages is draining a prior deployment.
      - ".github/workflows/deploy-pages.yml"
      - "src/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build umbrella site
        run: python -m src.build_site --site-base-url /

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages normally completes quickly, but successful deployments can take
    # several minutes while the provider drains its queue. Allow one full
    # attempt, then let the next scheduled delivery retry rather than stacking
    # several long attempts in the same concurrency lane.
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Let Pages settle before deployment
        run: sleep 45

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: 10000
          error_count: 20
          timeout: 600000
