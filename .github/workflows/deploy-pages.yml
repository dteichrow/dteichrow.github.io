name: deploy_pages

on:
  schedule:
    # Pull the latest committed Newsdesk artifact twice hourly, offset from the
    # 10-minute mirror commits so GitHub Pages deploys do not pile up.
    - cron: "23,53 * * * *"
  repository_dispatch:
    types:
      - newsdesk_published
  push:
    branches:
      - main
    paths-ignore:
      # Mirror-only Newsdesk commits can arrive more often than Pages can
      # deploy. Let the twice-hourly schedule and manual/repository dispatches
      # publish those artifacts instead of starting overlapping deploy jobs.
      - "docs/app_exports/**"
      - "docs/newsdesk/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build umbrella site
        run: python -m src.build_site --site-base-url /

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    steps:
      - name: Let Pages settle before deployment
        run: sleep 45

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: 10000
          error_count: 20

      - name: Wait before retrying Pages deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 75

      - name: Retry GitHub Pages deploy
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: 10000
          error_count: 20

      - name: Wait before final Pages deploy retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 150

      - name: Final GitHub Pages deploy retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        id: deployment_retry_2
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: 10000
          error_count: 20
