name: deploy_pages
on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  validated-artifact:
    uses: ./.github/workflows/validate-artifact.yml
    with:
      upload-pages: true
  deploy:
    needs: validated-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@v5
