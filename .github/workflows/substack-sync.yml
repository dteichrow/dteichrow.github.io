name: substack_sync

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/substack-sync.yml"
      - "src/**"
      - "requirements.txt"
      - "content/**"
      - "external/**"
      - "data/**"

permissions:
  contents: write

concurrency:
  group: substack-sync
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync recent Substack posts
        run: python -m src.substack_sync --mode incremental

      - name: Check Substack sync authority
        id: substack_health
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("notes/substack-sync-incremental.json").read_text())
          publish_blocked = bool(report.get("publish_blocked"))
          body_sync_available = bool(report.get("body_sync_available"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"publish_blocked={'true' if publish_blocked else 'false'}\n")
              output.write(f"body_sync_available={'true' if body_sync_available else 'false'}\n")
          if publish_blocked:
              print(
                  "All Substack discovery routes failed; skipping rebuild/commit so "
                  "the last successful essay archive stays intact."
              )
          elif body_sync_available:
              print(
                  "Substack discovery and sitemap confirmation succeeded; mirroring "
                  f"and publishing {report.get('total_manifest_records')} essay records."
              )
          else:
              print(
                  "Substack discovery succeeded without sitemap confirmation; publishing "
                  "new essay records without pruning or body mirroring."
              )
          PY

      - name: Build site
        if: steps.substack_health.outputs.publish_blocked != 'true'
        run: |
          if [ "${{ steps.substack_health.outputs.body_sync_available }}" = "true" ]; then
            python -m src.substack_sync --mode bodies
          fi
          python -m src.build_site --site-base-url /

      - name: Commit changes
        if: steps.substack_health.outputs.publish_blocked != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts.yml docs
          if git diff --cached --quiet; then
            echo "No content or docs changes to commit"
            exit 0
          fi
          git commit -m "Sync Substack posts and rebuild site"
          git push
